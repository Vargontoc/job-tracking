[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-emcan-tracking"
version = "0.1.0"
description = "API local para el parseo de ofertas de empleo"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pdfplumber",
    "PyYAML",
    "pytest",
    "selectolax",
    "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["source*"]
namespaces = true
